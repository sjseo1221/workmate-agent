services:
  workmate-agent:
    build: .
    ports:
      - "8001:8001"
    environment:
      WORKMATE_SERVICE_TOKEN: "${WORKMATE_SERVICE_TOKEN:?WORKMATE_SERVICE_TOKEN must be set}"
      APP_BASE_URL: "${APP_BASE_URL:-http://workmate-agent:8001/a2a}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
